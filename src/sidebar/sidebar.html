<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>TabHarbor</title>
  <link rel="stylesheet" href="../assets/m2.css" />
</head>
<body class="sidebar-body">
  <div id="side" class="side">
    <div id="titlebar" class="titlebar">
      <span class="logo">TabHarbor</span>
      <button id="btnClose" class="tbtn" data-label="关闭" data-act="close">✕</button>
    </div>
    <div id="searchbar" class="searchbar">
      <input id="q" type="text" placeholder="搜索标签与分组" />
      <button id="btnSettings" class="tbtn" data-label="设置" data-act="settings">⚙</button>
    </div>
    <div id="quickbar" class="quickbar">
      <button id="btnLocate" class="tbtn" data-label="定位当前标签" data-act="locate">⌖</button>
      <button id="btnExpand" class="tbtn" data-label="展开全部" data-act="expand">▾</button>
      <button id="btnCollapse" class="tbtn" data-label="收起全部" data-act="collapse">▴</button>
      <button id="btnAddGroup" class="tbtn" data-label="新建分组" data-act="add-group">＋</button>
      <button id="btnLinks" class="tbtn" data-label="窗口关联" data-act="links">🔗</button>
      <button id="btnTrash" class="tbtn" data-label="回收站" data-act="trash">🗑</button>
      <button id="btnHistory" class="tbtn" data-label="历史记录" data-act="history">◷</button>
      <button id="btnFullscreen" class="tbtn" data-label="全屏卡片页" data-act="fullscreen">⛶</button>
      <button id="btnTheme" class="tbtn" data-label="主题切换" data-act="theme">◐</button>
    </div>
    <div id="dataPanel" class="data-panel" hidden>
      <div class="data-panel-head"><strong>数据与备份</strong><button id="btnDataClose" class="tbtn" type="button">关闭</button></div>
      <div class="data-panel-actions">
        <button id="btnExportJson" type="button">导出 JSON</button>
        <button id="btnExportHtml" type="button">导出 HTML</button>
        <button id="btnImportFile" type="button">导入文件</button>
        <button id="btnBackupNow" type="button">立即备份</button>
      </div>
      <label for="backupTarget">备份目标</label>
      <select id="backupTarget"><option value="local">本地快照</option><option value="github">GitHub 仓库（标准 HTML）</option></select>
      <div id="githubBackupFields" hidden>
        <label for="ghRepo">GitHub 仓库 URL（公开或私有）</label><input id="ghRepo" type="url" placeholder="https://github.com/owner/repo" autocomplete="url" />
        <label for="ghBranch">分支</label><input id="ghBranch" type="text" placeholder="main" />
        <label for="ghPath">备份文件路径</label><input id="ghPath" type="text" placeholder="tabharbor-bookmarks.html" />
        <label for="ghToken">Fine-grained Personal Access Token</label><input id="ghToken" type="password" autocomplete="new-password" placeholder="仅保存于本机扩展存储" />
        <p>Token 仅存储在本机；只请求 api.github.com 权限，不会同步或写入日志。</p>
        <button id="btnAuthorizeGithub" type="button">授权 GitHub 访问</button>
      </div>
      <label for="ghBackupFreq">GitHub 自动备份频率</label>
      <select id="ghBackupFreq"><option value="off">关闭</option><option value="every10m">每 10 分钟</option><option value="every30m">每 30 分钟</option><option value="hourly">每小时</option><option value="daily">每天</option></select>
      <label for="backupList">本地快照（最多保留 20 份）</label>
      <select id="backupList"></select>
      <button id="btnRestoreBackup" type="button">确认恢复所选快照</button>
      <input id="importFile" type="file" accept=".json,.html,text/html,application/json" hidden />
      <p id="dataStatus" role="status" aria-live="polite"></p>
    </div>
    <div id="spBody" class="sp-body"></div>
    <div id="footer" class="footer">
      <span id="stats"></span>
      <span class="footer-actions"><button id="btnKeys" class="fbtn" data-label="快捷键">⌨</button><button id="btnGuide" class="fbtn" data-label="上手指南">?</button></span>
    </div>
    <div id="tip" class="tip"></div>
  </div>
  <script type="module" src="../ui/shell.js"></script>
</body>
</html>
