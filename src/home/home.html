<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>主页</title>
    <link rel="stylesheet" href="../assets/m2.css" />
    <link rel="stylesheet" href="home.css" />
  </head>
  <body class="home-body">
    <main class="home-wrap">
      <div class="home-top">
        <div class="home-brand"><span class="logo-mark"></span> TabHarbor</div>
        <button id="homeSettings" class="tbtn" title="主页设置" aria-label="主页设置">
          <svg
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.08a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.08A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 8.9 4.6a1.7 1.7 0 0 0 1.56-1.03V3a2 2 0 1 1 4 0v.08a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 8.9v.08a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.08A1.7 1.7 0 0 0 19.4 15Z"
            />
          </svg>
        </button>
      </div>

      <section class="home-search">
        <form id="homeSearchForm" class="home-search-box" autocomplete="off">
          <select
            id="homeEngine"
            class="home-engine"
            title="选择搜索引擎"
            aria-label="搜索引擎"
          ></select>
          <input
            id="homeQ"
            class="home-q"
            type="text"
            placeholder="搜索或输入网址，回车打开…"
            aria-label="搜索关键词"
          />
          <button class="home-go" type="submit" title="搜索" aria-label="搜索">
            <svg
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-3.5-3.5" />
            </svg>
          </button>
        </form>
      </section>

      <section class="home-sites-wrap">
        <div class="home-sites-head">
          <span class="home-sites-title">常用网址</span>
          <button id="homeAddSite" class="home-mini" type="button" title="添加网址">+ 添加</button>
        </div>
        <div id="homeSites" class="home-sites"></div>
      </section>
    </main>

    <!-- 主页配置面板（Q2 引擎 / Q3 常用网址增删改排序） -->
    <div id="homeCfgMask" class="mask" hidden>
      <div class="modal">
        <header>
          <h3>主页设置</h3>
          <button id="homeCfgClose" class="x tbtn" type="button" aria-label="关闭">✕</button>
        </header>
        <div class="content">
          <div class="sec-title">搜索引擎</div>
          <div id="engineList" class="home-cfg-engines"></div>
          <div class="field-row">
            <label for="customEngineName">自定义引擎名称</label>
            <input
              id="customEngineName"
              class="edit-input"
              type="text"
              placeholder="如：我的搜索"
            />
          </div>
          <div class="field-row">
            <label for="customEngineUrl">搜索地址（%s 为关键词占位）</label>
            <input
              id="customEngineUrl"
              class="edit-input"
              type="text"
              placeholder="https://example.com/search?q=%s"
            />
          </div>
          <div class="modal-actions">
            <button id="addEngine" class="btn" type="button">添加自定义引擎</button>
            <button id="resetHomeCfg" class="btn" type="button">恢复默认</button>
          </div>

          <div class="sec-title" style="margin-top: 18px">壁纸（仅内部主页）</div>
          <div class="field-row">
            <label for="wpMode">壁纸模式</label>
            <select id="wpMode" class="edit-input">
              <option value="none">无（默认渐变）</option>
              <option value="gradient">内置渐变</option>
              <option value="image">本地图片</option>
            </select>
          </div>
          <div class="field-row" id="wpPresetRow">
            <label for="wpPreset">渐变预设</label>
            <select id="wpPreset" class="edit-input"></select>
          </div>
          <div class="field-row hidden" id="wpImageRow">
            <label for="wpImage">本地图片（png/jpeg/webp，≤1MB）</label>
            <input
              id="wpImage"
              class="edit-input"
              type="file"
              accept="image/png,image/jpeg,image/webp"
            />
          </div>
          <div class="field-row" id="wpScrimRow">
            <label for="wpScrim">遮罩浓度 <span id="wpScrimVal">0.35</span></label>
            <input id="wpScrim" class="edit-input" type="range" min="0" max="0.85" step="0.05" />
          </div>
          <p class="home-hint">
            图片以 data URL 仅存本机，不上传、不提供远程地址；敏感内容请谨慎。
          </p>
          <div class="modal-actions">
            <button id="wpRemoveImage" class="btn" type="button">移除图片并恢复默认</button>
          </div>

          <div class="sec-title" style="margin-top: 18px">配置导入导出（M9）</div>
          <p class="home-hint">
            导出为独立配置文件；导入前确认、整体覆盖当前引擎与常用网址（不合并）。
          </p>
          <div class="modal-actions">
            <button id="homeExportCfg" class="btn" type="button">导出主页配置</button>
            <button id="homeImportCfg" class="btn" type="button">导入主页配置</button>
          </div>
          <input id="homeImportFile" type="file" hidden />

          <div class="sec-title" style="margin-top: 18px">常用网址</div>
          <p class="home-hint">可编辑名称 / 网址，或用 ↑↓ 调整顺序、删除站点。</p>
          <div id="siteEditList" class="home-cfg-sites"></div>
        </div>
      </div>
    </div>

    <div id="homeToast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="home.js"></script>
  </body>
</html>
